[package]
name = "cctv-energy-tauri"
version = "0.1.0"
description = "Нативное приложение гостя: расчет энергопотребления систем видеонаблюдения и поиск камер по изображению"
authors = ["Chobotov"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-cors-fetch = "2.1.1"
